name: magic_deeplink
description: Deep linking support for Magic Framework (Universal Links, App Links).
version: 0.1.0
homepage: https://magic.fluttersdk.com/deeplink
documentation: https://magic.fluttersdk.com/packages/deeplink/getting-started/installation
repository: https://github.com/fluttersdk/magic_deeplink
issue_tracker: https://github.com/fluttersdk/magic_deeplink/issues

topics:
  - deeplink
  - universal-links
  - app-links
  - magic
  - flutter

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # `MagicApp.register` returns `Future<void>` from 0.0.8 and `void` below it,
  # and this package's own suite awaits it: at `^0.0.5` the library still
  # analyzes clean but the tests do not compile, so the floor was naming a
  # version nothing here is verified against. 0.0.8 is the lowest that runs.
  magic: ^0.0.8
  fluttersdk_artisan: ^0.0.8
  app_links: ^7.0.0
  args: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

