name: magic_deeplink
description: Deep linking support for Magic Framework (Universal Links, App Links).
version: 0.1.6
homepage: https://magic.fluttersdk.com/deeplink
documentation: https://magic.fluttersdk.com/packages/deeplink/getting-started/installation
repository: https://github.com/fluttersdk/magic_deeplink
issue_tracker: https://github.com/fluttersdk/magic_deeplink/issues

topics:
  - deeplink
  - universal-links
  - app-links
  - magic
  - flutter

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # TWO reasons stacked, and they answer different questions.
  #
  # The floor cannot go below 0.0.8: `MagicApp.register` returns `void` there
  # and `Future<void>` from 0.0.8 on, and this package's suite awaits it, so
  # at `^0.0.5` the library analyzed clean while the tests did not compile.
  #
  # It sits at 0.0.22 because `DeeplinkOpened` and `DeeplinkNavigating`
  # implement `ReportsBreadcrumb`, which 0.0.22 introduces. 0.0.14 is where an
  # unresolvable route middleware alias stops the app at `Magic.init` instead
  # of leaving the route ungated, which is a breaking change a consumer of
  # this package inherits. The floor names 0.0.27, the newest release when
  # the 2026-10-09 batch re-pinned every sibling.
  magic: ^0.0.27
  fluttersdk_artisan: ^0.0.19
  app_links: ^7.0.0
  args: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

